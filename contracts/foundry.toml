[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
# The official RPC can be unreachable from some networks; robinhood.drpc.org also serves fork state.
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_drpc = "https://robinhood.drpc.org"

[lint]
lint_on_build = false
